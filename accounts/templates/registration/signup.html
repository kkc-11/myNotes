{% extends "base.html" %}
{% block content %}
<article style="max-width: 800px; margin: auto;">
    <h2>Sign Up</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Create Account</button>
    </form>
    <p>Already have an account? <a href="{% url 'login' %}">Login</a></p>
</article>
{% endblock %}
