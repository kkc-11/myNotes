{% extends "base.html" %}
{% block content %}
<article style="max-width: 400px; margin: auto;">
    <h2>Login</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Login</button>
    </form>
    <p>No account? <a href="{% url 'signup' %}">Sign up</a></p>
</article>
{% endblock %}
